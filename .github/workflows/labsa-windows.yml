name: Labsa - Build Windows e macOS

on:
  workflow_dispatch:

jobs:
  build:
    # Necessario para o passo "Publish Release" (em forks o token padrao e so leitura)
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "labsa"
