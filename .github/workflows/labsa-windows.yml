name: Labsa - Build Windows e macOS

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: "Quais instaladores gerar"
        type: choice
        options: [todas, windows, macos]
        default: todas
      macos-versao:
        description: "Versao do Mac usada no build (troque para 26 se o 15 ficar preso na fila)"
        type: choice
        options: ["15", "26"]
        default: "15"

jobs:
  build:
    # Necessario para o passo "Publish Release" (em forks o token padrao e so leitura)
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "labsa"
      plataforma: ${{ inputs.plataforma }}
      macos-versao: ${{ inputs.macos-versao }}
